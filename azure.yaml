# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: oracle-forms-migration-fleet
services:
    ai-project:
        host: azure.ai.project
        deployments:
            # Conversation and tool calling: high call volume, no deep reasoning required.
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 10
                name: GlobalStandard
            # Artifact review: adversarial reading of generated DDL, which the mini model does poorly.
            - model:
                format: OpenAI
                name: gpt-5.6-sol
                version: "2026-07-09"
              name: gpt-5.6-sol
              sku:
                capacity: 10
                name: GlobalStandard
    oracle-forms-migration-fleet:
        project: src/oracle-forms-migration-fleet
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            AZURE_AI_REVIEW_MODEL_DEPLOYMENT_NAME: gpt-5.6-sol
            AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: oracle-forms-migration-fleet.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Assessment and migration-planning fleet for Oracle Forms applications targeting Azure SQL Database or Azure SQL Managed Instance. A model-backed outer agent fronts a deterministic specialist fleet (inventory analyst, dependency mapper, target-platform advisor, conversion planner, validation reviewer) with a human approval gate. Assessment and planning only — no migration is executed.
        displayName: Oracle Forms Migration Fleet (.NET, Agent Framework)
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Responses Protocol
                - Agent Framework
                - .NET
                - Oracle Forms
                - Azure SQL
        name: oracle-forms-migration-fleet
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
