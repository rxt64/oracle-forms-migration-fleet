<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <title>Migration Fleet Workbench</title>
    <script>
      // Resolved before first paint so the shell never flashes the wrong surface. Dark is the default.
      (() => {
        const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
        let stored = null;
        try {
          stored = localStorage.getItem("ofm-workbench-theme-v1");
        } catch {
          stored = null;
        }
        const requested = param === "light" || param === "dark" ? param : stored;
        document.documentElement.setAttribute("data-theme", requested === "light" ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
