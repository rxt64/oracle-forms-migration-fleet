name: Provision source-gateway Oracle credential

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full current main SHA whose successful CI reviewed this tooling'
        required: true
        type: string
      ci_run_id:
        description: 'Successful main-push CI run for commit_sha'
        required: true
        type: string
      odbc_dsn:
        description: 'Existing 32-bit Oracle System DSN on the Forms VM'
        required: true
        default: OFM_GATEWAY_ORACLE9I
        type: string

permissions: {}

concurrency:
  group: oracle-forms-migration-fleet-source-gateway-oracle-credential
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: rxt64/oracle-forms-migration-fleet
  EXPECTED_SUBSCRIPTION_ID: d4394e57-c076-4c92-a870-5de6bf44f255
  EXPECTED_TENANT_ID: 1984d248-06ca-4d04-a3b8-4c0c1577ab86
  RESOURCE_GROUP: rg-oracle-forms-migration-fleet-dev-b9f0e875
  FORMS_VM: vm-ofm-forms6i-j6mrrerz
  ORACLE_VM: vm-ofm-oracle9i-j6mrrerz

jobs:
  package:
    name: Verify CI and package reviewed credential tooling
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      bundle_sha256: ${{ steps.bundle.outputs.bundle_sha256 }}
      release_tag: ${{ steps.bundle.outputs.release_tag }}
      asset_name: ${{ steps.bundle.outputs.asset_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact current main commit and trusted CI
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ && "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          git fetch --no-tags origin main "$REQUESTED_SHA"
          [[ "$(git rev-parse origin/main)" == "$REQUESTED_SHA" ]]
          gh api "repos/$EXPECTED_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          gh api "repos/$EXPECTED_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
          python3 .github/scripts/verify_required_ci.py "$EXPECTED_REPOSITORY" "$REQUESTED_SHA" manual \
            "$RUNNER_TEMP/ci-run.json" "$RUNNER_TEMP/ci-jobs.json"
          git checkout --detach "$REQUESTED_SHA"

      - name: Compile every embedded Python block before mutation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, textwrap

          workflow = pathlib.Path('.github/workflows/provision-source-gateway-oracle-credential.yml')
          lines = workflow.read_text().splitlines()
          marker = '<' + "<'PY'"
          compiled = 0
          index = 0
          while index < len(lines):
              if marker not in lines[index]:
                  index += 1
                  continue
              end = index + 1
              while end < len(lines) and lines[end].strip() != 'PY':
                  end += 1
              if end == len(lines):
                  raise SystemExit(f'Unterminated Python block after workflow line {index + 1}.')
              source = textwrap.dedent('\n'.join(lines[index + 1:end]))
              compile(source, f'{workflow}:python-block-{compiled + 1}', 'exec')
              compiled += 1
              index = end + 1
          if compiled == 0:
              raise SystemExit('No embedded Python blocks were found.')
          print(f'Compiled {compiled} embedded Python blocks.')
          PY

      - name: Create deterministic public tooling bundle
        id: bundle
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          RELEASE_TAG="source-gateway-oracle-credential-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$REQUESTED_SHA"
          ASSET_NAME="$RELEASE_TAG.zip"
          export RELEASE_TAG ASSET_NAME
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path.cwd()
          files = [
              root / 'infra/source-gateway/Complete-SourceGatewayCredentialTransfer.ps1',
              root / 'infra/source-gateway/New-SourceGatewayCredentialTransferKey.ps1',
              root / 'infra/source-lab/forms6i/New-SourceGatewayOracleCredential.ps1',
              root / 'infra/source-gateway/SourceGatewayCredentialTransfer.psm1',
              root / 'infra/source-gateway/SourceGatewayInstaller.Common.ps1',
          ]
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['ASSET_NAME']
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for source in sorted(files, key=lambda item: item.name):
                  info = zipfile.ZipInfo(source.name, date_time=(2026, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o600 << 16
                  archive.writestr(info, source.read_bytes())
          PY
          BUNDLE_SHA256=$(sha256sum "$RUNNER_TEMP/$ASSET_NAME" | cut -d' ' -f1)
          echo "bundle_sha256=$BUNDLE_SHA256" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: source-gateway-oracle-credential-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ steps.bundle.outputs.asset_name }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish unique non-latest public tooling release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      asset_url: ${{ steps.release.outputs.asset_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-gateway-oracle-credential-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release
      - name: Publish immutable tooling asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
          ASSET_NAME: ${{ needs.package.outputs.asset_name }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          ! gh release view "$RELEASE_TAG" --repo "$EXPECTED_REPOSITORY" >/dev/null 2>&1
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release/$ASSET_NAME#Reviewed Oracle credential tooling" \
            --repo "$EXPECTED_REPOSITORY" --target "$REQUESTED_SHA" --latest=false \
            --title "$RELEASE_TAG" --notes "Public source-gateway credential tooling for $REQUESTED_SHA. Contains no credential."
          echo "asset_url=https://github.com/$EXPECTED_REPOSITORY/releases/download/$RELEASE_TAG/$ASSET_NAME" >> "$GITHUB_OUTPUT"

  reachability:
    name: Verify public tooling reachability without credentials
    needs: [package, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download as an unauthenticated public client
        env:
          ASSET_URL: ${{ needs.publish.outputs.asset_url }}
          EXPECTED_SHA256: ${{ needs.package.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --max-filesize 1048576 \
            --output "$RUNNER_TEMP/oracle-credential-tooling.zip" "$ASSET_URL"
          [[ "$(sha256sum "$RUNNER_TEMP/oracle-credential-tooling.zip" | cut -d' ' -f1)" == "$EXPECTED_SHA256" ]]

  provision:
    name: Provision encrypted Oracle credential on pinned source-lab VMs
    needs: [package, publish, reachability]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Generate transfer identifier before key creation
        shell: bash
        run: |
          set -euo pipefail
          TRANSFER_ID=$(python3 -c 'import uuid; print(uuid.uuid4().hex)')
          [[ "$TRANSFER_ID" =~ ^[a-f0-9]{32}$ ]]
          echo "TRANSFER_ID=$TRANSFER_ID" >> "$GITHUB_ENV"
      - name: Create, encrypt, complete, and verify credential transfer
        shell: bash
        env:
          ASSET_URL: ${{ needs.publish.outputs.asset_url }}
          BUNDLE_SHA256: ${{ needs.package.outputs.bundle_sha256 }}
          ODBC_DSN: ${{ inputs.odbc_dsn }}
        run: |
          set -euo pipefail
          [[ "$(az account show --query id -o tsv)" == "$EXPECTED_SUBSCRIPTION_ID" ]]
          [[ "$(az account show --query tenantId -o tsv)" == "$EXPECTED_TENANT_ID" ]]
          [[ "$ODBC_DSN" =~ ^[A-Za-z][A-Za-z0-9_]{2,31}$ ]]
          invoke_guest() {
            local vm="$1" command="$2" operation="$3" output_file="$4"
            shift 4
            az vm run-command create --subscription "$EXPECTED_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" \
              --vm-name "$vm" --name "$command" --script @infra/source-gateway/Invoke-SourceGatewayOracleCredentialProvision.ps1 \
              --parameters "Operation=$operation" "BundleUrl=$ASSET_URL" "BundleSha256=$BUNDLE_SHA256" "$@" \
              --timeout-in-seconds 900 --async-execution false --output none
            az vm run-command show --subscription "$EXPECTED_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" \
              --vm-name "$vm" --name "$command" --expand instanceView --output json > "$output_file"
          }

          invoke_guest "$FORMS_VM" "ofm-oracle-preflight-$GITHUB_RUN_ID" ValidatePrerequisites "$RUNNER_TEMP/preflight.json" \
            "OdbcDsn=$ODBC_DSN"
          python3 - "$RUNNER_TEMP/preflight.json" "$ODBC_DSN" <<'PY'
          import json, pathlib, sys
          view = (json.loads(pathlib.Path(sys.argv[1]).read_text()).get('instanceView') or {})
          if view.get('executionState') != 'Succeeded' or view.get('exitCode') != 0: raise SystemExit('The Forms ODBC preflight failed.')
          lines = [line for line in (view.get('output') or '').splitlines() if line.strip()]
          if len(lines) != 1: raise SystemExit('The Forms ODBC preflight emitted non-allowlisted output.')
          value = json.loads(lines[0])
          expected = {'schemaVersion','status','dsn','driverName','driverPath','serviceName'}
          if set(value) != expected or value['status'] != 'prerequisites-verified' or value['dsn'] != sys.argv[2] or value['serviceName'] != 'OFMSourceGateway':
              raise SystemExit('Unexpected Forms ODBC preflight result.')
          PY

          invoke_guest "$FORMS_VM" "ofm-oracle-key-$GITHUB_RUN_ID" NewTransferKey "$RUNNER_TEMP/key.json" \
            "TransferId=$TRANSFER_ID"
          python3 - "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/key-result.json" "$TRANSFER_ID" <<'PY'
          import base64, hashlib, json, pathlib, sys
          view = (json.loads(pathlib.Path(sys.argv[1]).read_text()).get('instanceView') or {})
          if view.get('executionState') != 'Succeeded' or view.get('exitCode') != 0:
              raise SystemExit('The transfer-key Run Command failed.')
          lines = [line for line in (view.get('output') or '').splitlines() if line.strip()]
          if len(lines) != 1: raise SystemExit('The transfer-key leg emitted non-allowlisted output.')
          value = json.loads(lines[0])
          expected = {'schemaVersion','status','transferId','certificateThumbprint','expiresUtc','publicCertificateBase64','publicCertificateSha256'}
          if set(value) != expected or value['status'] != 'transfer-key-created' or value['transferId'] != sys.argv[3]:
              raise SystemExit('Unexpected transfer-key result.')
          public = base64.b64decode(value['publicCertificateBase64'], validate=True)
          if hashlib.sha256(public).hexdigest() != value['publicCertificateSha256']: raise SystemExit('Public certificate digest mismatch.')
          pathlib.Path(sys.argv[2]).write_text(json.dumps(value, separators=(',',':')))
          PY
          PUBLIC_CERTIFICATE=$(jq -r .publicCertificateBase64 "$RUNNER_TEMP/key-result.json")
          TRANSFER_THUMBPRINT=$(jq -r .certificateThumbprint "$RUNNER_TEMP/key-result.json")

          invoke_guest "$ORACLE_VM" "ofm-oracle-create-$GITHUB_RUN_ID" ProvisionOracle "$RUNNER_TEMP/oracle.json" \
            "PublicCertificateBase64=$PUBLIC_CERTIFICATE" "OdbcDsn=$ODBC_DSN"
          python3 - "$RUNNER_TEMP/oracle.json" "$RUNNER_TEMP/oracle-result.json" "$TRANSFER_THUMBPRINT" "$ODBC_DSN" <<'PY'
          import base64, hashlib, json, pathlib, sys
          view = (json.loads(pathlib.Path(sys.argv[1]).read_text()).get('instanceView') or {})
          if view.get('executionState') != 'Succeeded' or view.get('exitCode') != 0: raise SystemExit('The Oracle Run Command failed.')
          lines = [line for line in (view.get('output') or '').splitlines() if line.strip()]
          if len(lines) != 1: raise SystemExit('The Oracle leg emitted non-allowlisted output.')
          value = json.loads(lines[0])
          expected = {'schemaVersion','status','username','roleName','schema','dsn','grants','ciphertextBase64','ciphertextSha256','certificateThumbprint'}
          grants = ['CREATE SESSION','OFM_GATEWAY_SOURCE_RO','SELECT ON MERIDIAN TABLES','SELECT ON 13 SYS DBA DICTIONARY VIEWS']
          if (set(value) != expected or value['status'] != 'encrypted' or value['grants'] != grants
              or value['username'] != 'OFM_GATEWAY_RO' or value['roleName'] != 'OFM_GATEWAY_SOURCE_RO'
              or value['schema'] != 'MERIDIAN' or value['dsn'] != sys.argv[4]
              or value['certificateThumbprint'].upper() != sys.argv[3].upper()):
              raise SystemExit('Unexpected Oracle result.')
          cipher = base64.b64decode(value['ciphertextBase64'], validate=True)
          if hashlib.sha256(cipher).hexdigest() != value['ciphertextSha256']: raise SystemExit('Ciphertext digest mismatch.')
          pathlib.Path(sys.argv[2]).write_text(json.dumps(value, separators=(',',':')))
          PY
          CIPHERTEXT=$(jq -r .ciphertextBase64 "$RUNNER_TEMP/oracle-result.json")
          CIPHERTEXT_SHA256=$(jq -r .ciphertextSha256 "$RUNNER_TEMP/oracle-result.json")

          invoke_guest "$FORMS_VM" "ofm-oracle-complete-$GITHUB_RUN_ID" CompleteTransfer "$RUNNER_TEMP/complete.json" \
            "TransferId=$TRANSFER_ID" "TransferCertificateThumbprint=$TRANSFER_THUMBPRINT" \
            "CiphertextBase64=$CIPHERTEXT" "CiphertextSha256=$CIPHERTEXT_SHA256" "OdbcDsn=$ODBC_DSN"
          python3 - "$RUNNER_TEMP/complete.json" <<'PY'
          import json, pathlib, sys
          view = (json.loads(pathlib.Path(sys.argv[1]).read_text()).get('instanceView') or {})
          if view.get('executionState') != 'Succeeded' or view.get('exitCode') != 0: raise SystemExit('The completion Run Command failed.')
          lines = [line for line in (view.get('output') or '').splitlines() if line.strip()]
          if len(lines) != 1: raise SystemExit('The completion leg emitted non-allowlisted output.')
          value = json.loads(lines[0])
          expected = {'schemaVersion','status','variableName','username','schema','dsn','oracleConnectionRegistered','serviceName','serviceStatus'}
          if set(value) != expected or value['status'] != 'provisioned' or value['oracleConnectionRegistered'] is not True or value['serviceStatus'] != 'Running':
              raise SystemExit('The source gateway did not report the Oracle registration as complete.')
          print(json.dumps(value, separators=(',',':'), sort_keys=True))
          PY
      - name: Remove transfer certificate and CNG key
        if: always()
        shell: bash
        env:
          ASSET_URL: ${{ needs.publish.outputs.asset_url }}
          BUNDLE_SHA256: ${{ needs.package.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$TRANSFER_ID" =~ ^[a-f0-9]{32}$ ]]
          cleanup_file="$RUNNER_TEMP/transfer-cleanup.json"
          az vm run-command create --subscription "$EXPECTED_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" \
            --vm-name "$FORMS_VM" --name "ofm-oracle-key-cleanup-$GITHUB_RUN_ID" \
            --script @infra/source-gateway/Invoke-SourceGatewayOracleCredentialProvision.ps1 \
            --parameters "Operation=CleanupTransferKey" "BundleUrl=$ASSET_URL" "BundleSha256=$BUNDLE_SHA256" \
              "TransferId=$TRANSFER_ID" \
            --timeout-in-seconds 900 --async-execution false --output none
          az vm run-command show --subscription "$EXPECTED_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" \
            --vm-name "$FORMS_VM" --name "ofm-oracle-key-cleanup-$GITHUB_RUN_ID" \
            --expand instanceView --output json > "$cleanup_file"
          python3 - "$cleanup_file" "$TRANSFER_ID" <<'PY'
          import json, pathlib, sys
          view = (json.loads(pathlib.Path(sys.argv[1]).read_text()).get('instanceView') or {})
          if view.get('executionState') != 'Succeeded' or view.get('exitCode') != 0: raise SystemExit('Transfer-key cleanup failed.')
          lines = [line for line in (view.get('output') or '').splitlines() if line.strip()]
          if len(lines) != 1: raise SystemExit('Transfer-key cleanup emitted non-allowlisted output.')
          value = json.loads(lines[0])
          if set(value) != {'schemaVersion','status','transferId'} or value['status'] != 'transfer-key-removed' or value['transferId'] != sys.argv[2]: raise SystemExit('Unexpected transfer-key cleanup result.')
          PY
      - name: Delete managed Run Commands
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          commands=(
            "$FORMS_VM|ofm-oracle-preflight-$GITHUB_RUN_ID"
            "$FORMS_VM|ofm-oracle-key-$GITHUB_RUN_ID"
            "$ORACLE_VM|ofm-oracle-create-$GITHUB_RUN_ID"
            "$FORMS_VM|ofm-oracle-complete-$GITHUB_RUN_ID"
            "$FORMS_VM|ofm-oracle-key-cleanup-$GITHUB_RUN_ID"
          )
          for item in "${commands[@]}"; do
            IFS='|' read -r vm command <<< "$item"
            if az vm run-command show --subscription "$EXPECTED_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" \
              --vm-name "$vm" --name "$command" --output none 2>/dev/null; then
              az vm run-command delete --subscription "$EXPECTED_SUBSCRIPTION_ID" --resource-group "$RESOURCE_GROUP" \
                --vm-name "$vm" --name "$command" --yes --output none
            fi
          done