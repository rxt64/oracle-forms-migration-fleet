name: Deploy workbench

# Builds and ships the deployable image from CI, never from a workstation, so every deployed tag maps
# back to a commit. Authentication is OIDC: no registry password and no client secret is stored here.

on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'Full commit SHA whose required CI jobs passed'
        required: true
        type: string
      ci_run_id:
        description: 'Trusted CI workflow run that validated the SHA'
        required: true
        type: string
      verification_mode:
        description: 'Verification rules for automatic or manual deployment'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full main-branch commit SHA to deploy after successful CI'
        type: string
        required: true

concurrency:
  group: oracle-forms-migration-fleet-workbench-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: acrofmfleedevykbpnrpd
  IMAGE: migration-fleet-workbench
  RESOURCE_GROUP: rg-oracle-forms-migration-fleet-dev-b9f0e875
  CONTAINER_APP: ca-ofmfleet-dev-ykbpnrpd
  SANDBOX_PGHOST: pg-ofmfleet-dev-ykbpnrpd.postgres.database.azure.com
  SANDBOX_PGUSER: id-ofmfleet-web-dev-ykbpnrpd
  SANDBOX_PGDATABASE: postgres
  PLATFORM_PGHOST: pg-ofmfleet-dev-ykbpnrpd.postgres.database.azure.com
  PLATFORM_PGUSER: id-ofmfleet-web-dev-ykbpnrpd
  PLATFORM_PGDATABASE: ofm_platform
  WORKBENCH_AUTH_CLIENT_ID: 0ff0fa49-fce8-4801-ab93-e862a62fd6ab
  # Without these the reviewer and repair agents are never registered, and the fleet silently degrades
  # to single-pass deterministic conversion with no critique round.
  AZURE_OPENAI_ENDPOINT: https://cog-czusrhcg4gpm2.openai.azure.com/
  AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
  AZURE_AI_REVIEW_MODEL_DEPLOYMENT_NAME: gpt-5.6-sol

jobs:
  verify:
    name: Verify exact commit and CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      deploy_sha: ${{ steps.evidence.outputs.deploy_sha }}
      ci_run_id: ${{ steps.evidence.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve trusted CI evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CALLER_RUN_ID: ${{ inputs.ci_run_id }}
          VERIFICATION_MODE: ${{ inputs.verification_mode || 'manual' }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual deployments must run from the trusted main workflow." >&2
            exit 1
          fi

          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase 40-character SHA." >&2
            exit 1
          fi

          git fetch --no-tags origin main "$REQUESTED_SHA"
          git cat-file -e "$REQUESTED_SHA^{commit}"
          if ! git merge-base --is-ancestor "$REQUESTED_SHA" origin/main; then
            echo "Commit $REQUESTED_SHA is not reachable from origin/main." >&2
            exit 1
          fi

          ci_run_id="$CALLER_RUN_ID"
          if [[ "$VERIFICATION_MODE" == "manual" ]]; then
            ci_run_id=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REQUESTED_SHA&event=push&status=completed&per_page=100" \
              --jq '.workflow_runs | map(select(.head_sha == "'"$REQUESTED_SHA"'" and .conclusion == "success")) | sort_by(.created_at) | last | .id // empty')
          fi

          if [[ -z "$ci_run_id" || ! "$ci_run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful trusted CI run was found for $REQUESTED_SHA." >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id" > "$RUNNER_TEMP/ci-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
          python3 .github/scripts/verify_required_ci.py \
            "$GITHUB_REPOSITORY" \
            "$REQUESTED_SHA" \
            "$VERIFICATION_MODE" \
            "$RUNNER_TEMP/ci-run.json" \
            "$RUNNER_TEMP/ci-jobs.json"

          echo "deploy_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.deploy_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/oracle-forms-migration-fleet/ClientApp/package-lock.json

      # The Dockerfile builds the client itself, but installing here keeps the lockfile honest and
      # fails fast on a dependency problem before a slow image build starts.
      - name: Verify client dependencies resolve
        working-directory: src/oracle-forms-migration-fleet/ClientApp
        run: npm ci

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the registry
        run: az acr login --name "$REGISTRY"

      # The build context must be the project directory: the Dockerfile copies ClientApp/package.json,
      # which does not exist relative to the repository root.
      - name: Build and push the image
        working-directory: src/oracle-forms-migration-fleet
        env:
          DEPLOY_SHA: ${{ needs.verify.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          TAG="${DEPLOY_SHA::12}"
          docker build -f Dockerfile \
            --label "org.opencontainers.image.revision=$DEPLOY_SHA" \
            -t "$REGISTRY.azurecr.io/$IMAGE:$TAG" .
          docker push "$REGISTRY.azurecr.io/$IMAGE:$TAG"
          DIGEST=$(az acr manifest show-metadata \
            --registry "$REGISTRY" \
            --name "$IMAGE:$TAG" \
            --query digest \
            --output tsv)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ACR returned an invalid digest for $IMAGE:$TAG." >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Refuse stale automatic deployment before Azure mutation
        env:
          DEPLOY_SHA: ${{ needs.verify.outputs.deploy_sha }}
          VERIFICATION_MODE: ${{ inputs.verification_mode || 'manual' }}
        run: |
          set -euo pipefail
          if [[ "$VERIFICATION_MODE" == "automatic" ]]; then
            git fetch --no-tags origin main
            CURRENT_MAIN=$(git rev-parse origin/main)
            if [[ "$DEPLOY_SHA" != "$CURRENT_MAIN" ]]; then
              echo "A newer main commit $CURRENT_MAIN superseded automatic deployment $DEPLOY_SHA." >&2
              exit 1
            fi
          fi

      - name: Configure the sandbox database target
        run: |
          if [[ -z "$PLATFORM_PGHOST" || -z "$PLATFORM_PGDATABASE" || -z "$PLATFORM_PGUSER" || \
                -z "$SANDBOX_PGHOST" || -z "$SANDBOX_PGDATABASE" || -z "$SANDBOX_PGUSER" ]]; then
            echo "Platform and sandbox PostgreSQL coordinates are required." >&2
            exit 1
          fi
          if [[ "$PLATFORM_PGHOST" == "$SANDBOX_PGHOST" && "$PLATFORM_PGDATABASE" == "$SANDBOX_PGDATABASE" ]]; then
            echo "Platform authorization state and sandbox migration must use different PostgreSQL databases." >&2
            exit 1
          fi
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              "SANDBOX_PGHOST=$SANDBOX_PGHOST" \
              "SANDBOX_PGUSER=$SANDBOX_PGUSER" \
              "SANDBOX_PGDATABASE=$SANDBOX_PGDATABASE" \
              "SANDBOX_PGSCHEMA=public" \
              "SANDBOX_AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" \
              "SANDBOX_AZURE_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
              "SANDBOX_AZURE_RESOURCE_GROUP=$RESOURCE_GROUP" \
              "SANDBOX_AZURE_RESOURCE_ID=/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.DBforPostgreSQL/flexibleServers/pg-ofmfleet-dev-ykbpnrpd" \
              "SANDBOX_AZURE_REGION=eastus2" \
              "WORKBENCH_AUTH_MODE=ContainerApps" \
              "WORKBENCH_AUTH_TENANT_ID=${{ vars.AZURE_TENANT_ID }}" \
              "WORKBENCH_AUTH_CLIENT_ID=$WORKBENCH_AUTH_CLIENT_ID" \
              "WORKBENCH_AUTH_AUDIENCE=$WORKBENCH_AUTH_CLIENT_ID,api://$WORKBENCH_AUTH_CLIENT_ID" \
              "WORKBENCH_AUTH_ISSUER=https://login.microsoftonline.com/${{ vars.AZURE_TENANT_ID }}/v2.0" \
              "PLATFORM_PGHOST=$PLATFORM_PGHOST" \
              "PLATFORM_PGUSER=$PLATFORM_PGUSER" \
              "PLATFORM_PGDATABASE=$PLATFORM_PGDATABASE" \
              "PLATFORM_PGSCHEMA=ofm_platform" \
            --output none

      - name: Configure the review and repair agents
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              "AZURE_OPENAI_ENDPOINT=$AZURE_OPENAI_ENDPOINT" \
              "AZURE_AI_MODEL_DEPLOYMENT_NAME=$AZURE_AI_MODEL_DEPLOYMENT_NAME" \
              "AZURE_AI_REVIEW_MODEL_DEPLOYMENT_NAME=$AZURE_AI_REVIEW_MODEL_DEPLOYMENT_NAME" \
            --output none

      - name: Deploy the image
        env:
          DEPLOY_SHA: ${{ needs.verify.outputs.deploy_sha }}
          VERIFICATION_MODE: ${{ inputs.verification_mode || 'manual' }}
        run: |
          set -euo pipefail
          if [[ "$VERIFICATION_MODE" == "automatic" ]]; then
            git fetch --no-tags origin main
            CURRENT_MAIN=$(git rev-parse origin/main)
            if [[ "$DEPLOY_SHA" != "$CURRENT_MAIN" ]]; then
              echo "A newer main commit $CURRENT_MAIN superseded automatic deployment $DEPLOY_SHA before image switch." >&2
              exit 1
            fi
          fi
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/$IMAGE@$IMAGE_DIGEST" \
            --output none

      - name: Report what is running
        run: |
          az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "{image:properties.template.containers[0].image, fqdn:properties.configuration.ingress.fqdn, status:properties.runningStatus}" \
            --output yaml
