name: Deploy migrated Northstar demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-migrated-demo.yml
      - demo/northstar-migrated/**
      - infra/northstar-migrated/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-migrated-northstar
  cancel-in-progress: false

env:
  REGISTRY: acrofmfleedevykbpnrpd
  IMAGE: northstar-migrated
  RESOURCE_GROUP: rg-oracle-forms-migration-fleet-dev-b9f0e875
  CONTAINER_APP: ca-ofmfleet-migrated-dev-ykbpnrpd

jobs:
  validate:
    name: Compile generated application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/northstar-migrated/backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo/northstar-migrated/frontend/package-lock.json

      - name: Build React client
        working-directory: demo/northstar-migrated/frontend
        run: |
          npm ci
          npm run build

      - name: Build Spring Boot API
        working-directory: demo/northstar-migrated/backend
        run: mvn -B -DskipTests package

  deploy:
    name: Build image and deploy destination
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and publish migrated image
        run: |
          TAG="${GITHUB_SHA::12}"
          az acr build \
            --registry "$REGISTRY" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:$TAG" \
            --file demo/northstar-migrated/Dockerfile \
            demo/northstar-migrated
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Preview destination deployment
        run: |
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/northstar-migrated/main.bicep \
            --parameters containerImage="$REGISTRY.azurecr.io/$IMAGE:$TAG" \
            --no-pretty-print

      - name: Deploy destination application
        run: |
          az deployment group create \
            --name "northstar-migrated-${GITHUB_RUN_NUMBER}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/northstar-migrated/main.bicep \
            --parameters containerImage="$REGISTRY.azurecr.io/$IMAGE:$TAG" \
            --output none

      - name: Verify UI and migrated PostgreSQL data
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          curl --fail --show-error --silent \
            --retry 18 --retry-delay 10 --retry-all-errors \
            "https://$FQDN/" > /dev/null
          curl --fail --show-error --silent \
            --retry 6 --retry-delay 10 --retry-all-errors \
            "https://$FQDN/api/bank-account" | tee bank-accounts.json
          test "$(jq length bank-accounts.json)" -gt 0
          echo "Migrated application: https://$FQDN"