name: CI

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-worker-contract:
    name: Native source worker contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x86 worker
        shell: pwsh
        run: >-
          dotnet publish src/OracleFormsMigrationFleet.SourceWorker/OracleFormsMigrationFleet.SourceWorker.csproj
          -c Release -r win-x86 --self-contained true -o "$env:RUNNER_TEMP/source-worker"

      - name: Verify blocked native probe contract
        shell: pwsh
        run: |
          $request = '{"schemaVersion":1,"sourceEnvironmentId":"legacy-order-entry","expectedFormsRelease":"6.0.8.22.1"}'
          $output = $request | & "$env:RUNNER_TEMP/source-worker/OracleFormsMigrationFleet.SourceWorker.exe" --probe
          $exitCode = $LASTEXITCODE
          $result = $output | ConvertFrom-Json
          if ($exitCode -ne 2) { throw "Expected blocked-prerequisite exit 2, got $exitCode." }
          if ($result.status -ne 'BlockedPrerequisite') { throw "Worker did not report BlockedPrerequisite." }
          if ($result.processArchitecture -ne 'X86') { throw "Worker architecture was $($result.processArchitecture), not X86." }
          $installation = $result.capabilities | Where-Object id -eq 'forms.installation'
          if ($installation.prerequisite -ne 'OracleFormsInstallation' -or
              $installation.requiredArchitecture -ne 'x86' -or
              $installation.requiredHost -ne 'WindowsWorker') {
            throw "Worker did not report the missing Forms 6i installation prerequisite."
          }
          if (Test-Path "$env:RUNNER_TEMP/source-worker/coreclr.dll") {
            throw 'Worker publish unexpectedly depends on loose runtime files.'
          }
          if (Test-Path "$env:RUNNER_TEMP/source-worker/hostfxr.dll") {
            throw 'Worker publish unexpectedly depends on a loose hostfxr.'
          }
          Write-Output 'Self-contained single-file publish confirmed.'
          exit 0

      - name: Verify rejected worker requests
        shell: pwsh
        run: |
          '{"schemaVersion":0}' | & "$env:RUNNER_TEMP/source-worker/OracleFormsMigrationFleet.SourceWorker.exe" --probe 2>$null
          if ($LASTEXITCODE -ne 65) { throw "Expected malformed-request exit 65, got $LASTEXITCODE." }
          $oversized = '{"schemaVersion":1,"sourceEnvironmentId":"legacy-order-entry","expectedFormsRelease":"6.0.8.22.1"}' + (' ' * 8193)
          $oversized | & "$env:RUNNER_TEMP/source-worker/OracleFormsMigrationFleet.SourceWorker.exe" --probe 2>$null
          if ($LASTEXITCODE -ne 65) { throw "Expected oversized-request exit 65, got $LASTEXITCODE." }
          & "$env:RUNNER_TEMP/source-worker/OracleFormsMigrationFleet.SourceWorker.exe" --unsupported 2>$null
          if ($LASTEXITCODE -ne 64) { throw "Expected unsupported-command exit 64, got $LASTEXITCODE." }
          exit 0

      - name: Verify host-to-worker round trip
        shell: pwsh
        env:
          RUN_SOURCE_WORKER_INTEGRATION: 'true'
          FORMS_SOURCE_WORKER_PATH: ${{ runner.temp }}\source-worker\OracleFormsMigrationFleet.SourceWorker.exe
          SOURCE_WORKER_INTEGRATION_SENTINEL: ${{ runner.temp }}\source-worker-integration.passed
        run: |
          dotnet test tests/oracle-forms-migration-fleet.Tests/oracle-forms-migration-fleet.Tests.csproj --filter "Category=SourceWorkerIntegration" -p:SkipClientBuild=true
          if (!(Test-Path "$env:SOURCE_WORKER_INTEGRATION_SENTINEL")) {
            throw 'The host-to-worker integration test did not execute its real process path.'
          }

  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ofm_integration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ofm_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install network-isolated test runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo chown root:root /usr/bin/bwrap
          sudo chmod u+s /usr/bin/bwrap

      # The client must be installed before the .NET build: the csproj only runs the vite build when
      # ClientApp/node_modules already exists, and would otherwise silently produce no wwwroot.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/oracle-forms-migration-fleet/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: src/oracle-forms-migration-fleet/ClientApp
        run: npm ci

      - name: Test exact-SHA deployment verifier
        run: python3 .github/scripts/test_verify_required_ci.py

      - name: Test schema-aware release recovery policy
        run: python3 .github/scripts/test_release_recovery.py

      - name: Test post-deployment smoke client
        run: python3 .github/scripts/test_post_deploy_smoke.py

      - name: Test auth allowlist transformer
        run: python3 .github/scripts/test_update_auth_allowlist.py

      - name: Type-check and build client
        working-directory: src/oracle-forms-migration-fleet/ClientApp
        run: npm run build

      - name: Restore
        run: dotnet restore

      - name: Validate deployment infrastructure syntax
        shell: pwsh
        env:
          WORKBENCH_OPERATOR_PRINCIPAL_OBJECT_IDS: 00000000-0000-0000-0000-000000000000
        run: |
          $ErrorActionPreference = 'Stop'
          $templates = @(
            'infra/workbench/main.bicep',
            'infra/dotnet-pilot/main.bicep'
          )
          foreach ($template in $templates) {
            $output = Join-Path $env:RUNNER_TEMP "$([IO.Path]::GetFileNameWithoutExtension($template))-$([Guid]::NewGuid().ToString('N')).json"
            az bicep build --file $template --outfile $output --only-show-errors
            if ($LASTEXITCODE -ne 0) { throw "Bicep compilation failed for $template." }
          }

          $parameterFiles = @(
            'infra/workbench/dev.bicepparam',
            'infra/dotnet-pilot/dev.bicepparam'
          )
          foreach ($parameterFile in $parameterFiles) {
            $output = Join-Path $env:RUNNER_TEMP "params-$([Guid]::NewGuid().ToString('N')).json"
            az bicep build-params --file $parameterFile --outfile $output --only-show-errors
            if ($LASTEXITCODE -ne 0) { throw "Bicep parameter compilation failed for $parameterFile." }
          }

          $scripts = @(
            'infra/workbench/Deploy-Workbench.ps1',
            'infra/workbench/Preview-WorkbenchInfrastructure.ps1',
            'infra/dotnet-pilot/Setup-DotNetPilot.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void] [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref] $tokens, [ref] $errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell parsing failed for $script`: $($errors.Message -join '; ')"
            }
          }

      - name: Prime trusted generated-app dependency caches
        shell: bash
        run: |
          set -euo pipefail
          CACHE_ROOT="$RUNNER_TEMP/ofm-verification-cache"
          mkdir -p "$CACHE_ROOT/m2" "$CACHE_ROOT/npm"
          mvn --batch-mode --no-transfer-progress \
            -Dmaven.repo.local="$CACHE_ROOT/m2" \
            dependency:get \
            -Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.2.5 \
            -Dtransitive=true
          mvn --batch-mode --no-transfer-progress \
            -Dmaven.repo.local="$CACHE_ROOT/m2" \
            dependency:get \
            -Dartifact=org.junit.platform:junit-platform-launcher:1.10.5 \
            -Dtransitive=true
          mvn --batch-mode --no-transfer-progress \
            -f src/oracle-forms-migration-fleet/Fleet/Execution/Templates/Verification/pom.xml \
            -Dmaven.repo.local="$CACHE_ROOT/m2" \
            -Dspring-boot.repackage.skip=true \
            -DskipTests package
          npm ci \
            --prefix src/oracle-forms-migration-fleet/Fleet/Execution/Templates/Verification/Generic \
            --ignore-scripts --no-audit --no-fund --cache="$CACHE_ROOT/npm"
          npm ci \
            --prefix src/oracle-forms-migration-fleet/Fleet/Execution/Templates/Verification/Northstar \
            --ignore-scripts --no-audit --no-fund --cache="$CACHE_ROOT/npm"
          rm -rf \
            src/oracle-forms-migration-fleet/Fleet/Execution/Templates/Verification/Generic/node_modules \
            src/oracle-forms-migration-fleet/Fleet/Execution/Templates/Verification/Northstar/node_modules
          # The NuGet leg is a folder feed built from a trusted restore, not from anything checked in:
          # the seed project is copied out of the tree first so its obj/ never lands in the embedded
          # template resources, then every .nupkg NuGet resolved is copied into the feed.
          SEED="$RUNNER_TEMP/dotnet-verification-seed"
          mkdir -p "$SEED" "$CACHE_ROOT/nuget"
          cp src/oracle-forms-migration-fleet/Fleet/Execution/Templates/Verification/DotNet/VerificationCache.csproj "$SEED/"
          dotnet restore "$SEED/VerificationCache.csproj" \
            --packages "$RUNNER_TEMP/ofm-nuget-packages" --verbosity minimal
          find "$RUNNER_TEMP/ofm-nuget-packages" -type f -name '*.nupkg' \
            -exec cp --no-clobber --target-directory="$CACHE_ROOT/nuget" {} +
          for package in npgsql.9.0.3 azure.identity.1.13.2 microsoft.net.test.sdk.17.14.1 \
            xunit.2.9.3 xunit.runner.visualstudio.3.1.4; do
            if [ ! -f "$CACHE_ROOT/nuget/$package.nupkg" ]; then
              echo "Offline NuGet feed is missing $package.nupkg; the seed project has drifted from DotNetBackendEmitter."
              exit 1
            fi
          done
          echo "WORKBENCH_VERIFICATION_MAVEN_REPOSITORY=$CACHE_ROOT/m2" >> "$GITHUB_ENV"
          echo "WORKBENCH_VERIFICATION_NPM_CACHE=$CACHE_ROOT/npm" >> "$GITHUB_ENV"
          echo "WORKBENCH_VERIFICATION_NUGET_CACHE=$CACHE_ROOT/nuget" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build --no-restore -c Release -p:SkipClientBuild=true

      - name: Test Forms 6i-12c textual pipeline matrix
        run: |
          set -o pipefail
          MATRIX_TEST=A_text_export_from_each_intake_family_reaches_strict_ir_and_application_generation
          dotnet test --no-build -c Release -p:SkipClientBuild=true \
            --filter "FullyQualifiedName~$MATRIX_TEST" \
            --logger "console;verbosity=normal" | tee forms-textual-matrix.log
          PASSED=$(grep -c "Passed .*${MATRIX_TEST}(" forms-textual-matrix.log || true)
          if [ "$PASSED" -ne 5 ]; then
            echo "Expected exactly 5 passed Forms textual-pipeline rows, but found $PASSED."
            exit 1
          fi

      - name: Test PostgreSQL platform state integration
        env:
          PLATFORM_POSTGRES_INTEGRATION_CONNECTION: Host=localhost;Port=5432;Database=ofm_integration;Username=postgres;Password=postgres;SSL Mode=Disable;Pooling=false
          REQUIRE_POSTGRES_INTEGRATION: 'true'
          GENERATED_APP_INTEGRATION_EVIDENCE: ${{ runner.temp }}/generated-app-evidence
        run: >-
          dotnet test --no-build -c Release -p:SkipClientBuild=true
          --filter "Category=PostgresIntegration"
          --logger "console;verbosity=normal"

      # The Java generated-application legs. The .NET class carries the same trait but is excluded here and
      # run by the step below, which is the one that has a database and declares itself required.
      - name: Execute independently generated applications
        env:
          RUN_GENERATED_APP_INTEGRATION: 'true'
        run: >-
          dotnet test --no-build -c Release -p:SkipClientBuild=true
          --filter "Category=GeneratedApplicationIntegration&FullyQualifiedName!~DotNetGeneratedApplicationPostgresTests"
          --logger "console;verbosity=normal"

      # Real execution of the generated .NET application: its acceptance suite over HTTP against the
      # PostgreSQL service, the no-target leg that must fail every case, and the generated front end.
      # REQUIRE_GENERATED_DOTNET_INTEGRATION turns any missing prerequisite into a failure, so none of
      # these legs can pass by skipping.
      - name: Execute generated .NET application against PostgreSQL
        env:
          PLATFORM_POSTGRES_INTEGRATION_CONNECTION: Host=localhost;Port=5432;Database=ofm_integration;Username=postgres;Password=postgres;SSL Mode=Disable;Pooling=false
          RUN_GENERATED_DOTNET_INTEGRATION: 'true'
          RUN_GENERATED_NPM_INTEGRATION: 'true'
          REQUIRE_GENERATED_DOTNET_INTEGRATION: 'true'
          GENERATED_APP_INTEGRATION_EVIDENCE: ${{ runner.temp }}/generated-app-evidence
        run: >-
          dotnet test --no-build -c Release -p:SkipClientBuild=true
          --filter "FullyQualifiedName~DotNetGeneratedApplicationPostgresTests"
          --results-directory ${{ runner.temp }}/generated-app-evidence/host
          --logger "trx;LogFileName=generated-dotnet-host.trx"
          --logger "console;verbosity=normal"

      # A passing test count does not prove a leg executed: each sentinel below is written by the test
      # itself, after its assertions held, and each report is the generated runner's own output.
      - name: Verify per-fixture generated execution evidence
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/generated-app-evidence"
          missing=0
            for fixture in meridian kestrel meridian-unbound; do
            for sentinel in sql sql-concurrency compile no-target postgres frontend; do
              if [ ! -f "$EVIDENCE/$sentinel-$fixture.passed" ]; then
                echo "Missing sentinel $sentinel-$fixture.passed: that leg did not finish asserting."
                missing=1
              fi
            done
            for report in no-target-$fixture.trx postgres-$fixture.trx frontend-$fixture.xml; do
              if [ ! -s "$EVIDENCE/$report" ]; then
                echo "Missing or empty generated report $report."
                missing=1
              fi
            done
          done
          exit "$missing"

      - name: Upload generated execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-app-evidence-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/generated-app-evidence/

      - name: Test
        run: dotnet test --no-build -c Release -p:SkipClientBuild=true --logger "console;verbosity=normal"

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Proves the Dockerfile still builds without pushing anywhere. The deployed image is built by
      # Azure Container Registry, not here.
      - name: Build workbench image
        working-directory: src/oracle-forms-migration-fleet
        run: docker build -f Dockerfile -t migration-fleet-workbench:ci .

      - name: Verify networkless generated-code runner image
        run: >-
          docker run --rm --network none --entrypoint /usr/bin/node migration-fleet-workbench:ci -e
          "const s=require('node:net').connect(80,'169.254.169.254');s.setTimeout(500,()=>process.exit(0));s.on('error',()=>process.exit(0));s.on('connect',()=>process.exit(1))"

      - name: Build Forms replica image
        working-directory: src/oracle-forms-demo
        run: docker build -f Dockerfile -t oracle-forms-demo:ci .

  guided-ui:
    name: Guided UI browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/oracle-forms-migration-fleet/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: src/oracle-forms-migration-fleet/ClientApp
        run: npm ci

      - name: Build client
        working-directory: src/oracle-forms-migration-fleet/ClientApp
        run: npm run build

      - name: Install Chromium
        working-directory: src/oracle-forms-migration-fleet/ClientApp
        run: npx playwright install --with-deps chromium

      - name: Run guided UI checks
        working-directory: src/oracle-forms-migration-fleet/ClientApp
        run: npm run test:e2e

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-ui-playwright-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            src/oracle-forms-migration-fleet/ClientApp/playwright-report/
            src/oracle-forms-migration-fleet/ClientApp/test-results/

  deploy:
    name: Deploy verified workbench
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native-worker-contract, build-and-test, container, guided-ui]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      commit_sha: ${{ github.sha }}
      ci_run_id: ${{ github.run_id }}
      verification_mode: automatic
