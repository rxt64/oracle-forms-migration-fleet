name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The client must be installed before the .NET build: the csproj only runs the vite build when
      # ClientApp/node_modules already exists, and would otherwise silently produce no wwwroot.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/oracle-forms-migration-fleet/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: src/oracle-forms-migration-fleet/ClientApp
        run: npm ci

      - name: Type-check and build client
        working-directory: src/oracle-forms-migration-fleet/ClientApp
        run: npm run build

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:SkipClientBuild=true

      - name: Test
        run: dotnet test --no-build -c Release -p:SkipClientBuild=true --logger "console;verbosity=normal"

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Proves the Dockerfile still builds without pushing anywhere. The deployed image is built by
      # Azure Container Registry, not here.
      - name: Build image
        working-directory: src/oracle-forms-migration-fleet
        run: docker build -f Dockerfile -t migration-fleet-workbench:ci .
